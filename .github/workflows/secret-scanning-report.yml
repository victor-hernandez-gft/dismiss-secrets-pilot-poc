name: Secret Scanning Alert Report

on:
  push:
    branches:
      - main

concurrency:
  group: secret-scanning-alerts
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate report of open secret scanning alerts
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          SECRET_SCANNING_READ_TOKEN: ${{ secrets.SECRET_SCANNING_READ_TOKEN }}
        run: node .github/scripts/generate-secret-scanning-report.mjs

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: secret-scanning-alerts-${{ github.sha }}
          path: |
            secret-scanning-alerts.md
            secret-scanning-alerts.json
          if-no-files-found: error
          retention-days: 7

  create-alert-issues:
    needs: report
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download alert data
        uses: actions/download-artifact@v4
        with:
          name: secret-scanning-alerts-${{ github.sha }}
          path: report

      - name: Create one issue per new alert
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          ALERT_REPORT_PATH: report/secret-scanning-alerts.json
        run: node .github/scripts/create-secret-scanning-issues.mjs
