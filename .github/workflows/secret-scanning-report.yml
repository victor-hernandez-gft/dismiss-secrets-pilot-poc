name: Secret Scanning Alert Report

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: secret-scanning-alerts
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate report of open secret scanning alerts
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          SECRET_SCANNING_READ_TOKEN: ${{ secrets.SECRET_SCANNING_READ_TOKEN }}
        run: node .github/scripts/generate-secret-scanning-report.mjs

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: secret-scanning-alerts-${{ github.sha }}
          path: |
            secret-scanning-alerts.md
            secret-scanning-alerts.json
          if-no-files-found: error
          retention-days: 7

  analyze-alerts:
    needs: report
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out analysis script
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts/analyze-secret-scanning-alerts.mjs

      - name: Download alert report
        uses: actions/download-artifact@v4
        with:
          name: secret-scanning-alerts-${{ github.sha }}
          path: report

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Analyze alerts with OpenAI
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          ALERT_REPORT_PATH: report/secret-scanning-alerts.json
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          ANALYSIS_OUTPUT_PATH: secret-scanning-analysis.json
        run: node .github/scripts/analyze-secret-scanning-alerts.mjs

      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: secret-scanning-analysis-${{ github.sha }}
          path: secret-scanning-analysis.json
          if-no-files-found: error
          retention-days: 7

  publish-issue-analysis:
    needs: analyze-alerts
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download alert report
        uses: actions/download-artifact@v4
        with:
          name: secret-scanning-alerts-${{ github.sha }}
          path: report

      - name: Download alert analysis
        uses: actions/download-artifact@v4
        with:
          name: secret-scanning-analysis-${{ github.sha }}
          path: analysis

      - name: Create or update issues and publish analysis
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          ALERT_REPORT_PATH: report/secret-scanning-alerts.json
          ALERT_ANALYSIS_PATH: analysis/secret-scanning-analysis.json
        run: node .github/scripts/create-secret-scanning-issues.mjs
