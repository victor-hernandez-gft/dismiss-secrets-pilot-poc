name: Secret Scanning Alert Report

on:
  push:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate report of open secret scanning alerts
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          SECRET_SCANNING_READ_TOKEN: ${{ secrets.SECRET_SCANNING_READ_TOKEN }}
        run: node .github/scripts/generate-secret-scanning-report.mjs

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: secret-scanning-alerts-${{ github.sha }}
          path: secret-scanning-alerts.json
          if-no-files-found: error
          retention-days: 7
